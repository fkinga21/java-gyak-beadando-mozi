<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Üzenetek')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>

<main class="container my-4">
  <h1 class="mb-4">Üzenetek</h1>
  <p th:if="${#lists.isEmpty(uzenetek)}">Még nem érkezett üzenet.</p>
  <div class="table-responsive" th:unless="${#lists.isEmpty(uzenetek)}">
    <table class="table table-striped table-hover align-middle">
      <thead>
      <tr><th>Küldés ideje</th><th>Név</th><th>E-mail</th><th>Tárgy</th><th>Üzenet</th></tr>
      </thead>
      <tbody>
      <tr th:each="u : ${uzenetek}">
        <td th:text="${#temporals.format(u.kuldesIdeje, 'yyyy.MM.dd. HH:mm')}"></td>
        <td th:text="${u.nev}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.targy}"></td>
        <td th:text="${u.szoveg}" style="white-space: pre-wrap;"></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
