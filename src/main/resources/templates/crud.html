<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('CRUD')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>

<main class="container my-4">
  <h1 class="mb-3">Filmek kezelése</h1>

  <div th:if="${siker}" th:text="${siker}" class="alert alert-success"></div>
  <div th:if="${hiba}" th:text="${hiba}" class="alert alert-danger"></div>

  <a class="btn btn-success mb-3" th:href="@{/crud/uj}">Új film hozzáadása</a>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead>
      <tr><th>ID</th><th>Cím</th><th>Év</th><th>Hossz (perc)</th><th>Műveletek</th></tr>
      </thead>
      <tbody>
      <tr th:each="f : ${filmek}">
        <td th:text="${f.id}"></td>
        <td th:text="${f.cim}"></td>
        <td th:text="${f.ev}"></td>
        <td th:text="${f.hossz}"></td>
        <td>
          <a class="btn btn-outline-warning btn-sm" th:href="@{/crud/szerkeszt/{id}(id=${f.id})}">Szerkesztés</a>
          <form th:action="@{/crud/torles/{id}(id=${f.id})}" method="post" class="d-inline"
                onsubmit="return confirm('Biztosan törli ezt a filmet?');">
            <button type="submit" class="btn btn-outline-danger btn-sm">Törlés</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
