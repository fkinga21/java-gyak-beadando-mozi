<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Adatbázis')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>

<main class="container my-4">
    <h1 class="mb-4">Adatbázis</h1>

    <h2>Filmek</h2>
    <div class="table-responsive tabla-gorgetheto mb-5">
        <table class="table table-striped table-hover table-sm align-middle">
            <thead><tr><th>ID</th><th>Cím</th><th>Év</th><th>Hossz (perc)</th></tr></thead>
            <tbody>
            <tr th:each="f : ${filmek}">
                <td th:text="${f.id}"></td>
                <td th:text="${f.cim}"></td>
                <td th:text="${f.ev}"></td>
                <td th:text="${f.hossz}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2>Mozik</h2>
    <div class="table-responsive tabla-gorgetheto mb-5">
        <table class="table table-striped table-hover table-sm align-middle">
            <thead><tr><th>ID</th><th>Név</th><th>Város</th><th>Férőhely</th></tr></thead>
            <tbody>
            <tr th:each="m : ${mozik}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.nev}"></td>
                <td th:text="${m.varos}"></td>
                <td th:text="${m.ferohely}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2 id="eloadasok">Előadások</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover table-sm align-middle">
            <thead>
            <tr><th>Dátum</th><th>Film</th><th>Mozi</th><th>Város</th><th>Nézők</th><th>Bevétel (Ft)</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${eloadasok.content}">
                <td th:text="${#temporals.format(e.datum, 'yyyy.MM.dd.')}"></td>
                <td th:text="${e.film.cim}"></td>
                <td th:text="${e.mozi.nev}"></td>
                <td th:text="${e.mozi.varos}"></td>
                <td th:text="${e.nezoszam}"></td>
                <td th:text="${#numbers.formatInteger(e.bevetel, 3, 'WHITESPACE')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <a class="btn btn-outline-light btn-sm" th:if="${eloadasok.hasPrevious()}"
           th:href="@{/adatbazis(page=${eloadasok.number - 1})}">« Előző</a>
        <span th:unless="${eloadasok.hasPrevious()}"></span>
        <span th:text="${eloadasok.number + 1} + ' / ' + ${eloadasok.totalPages} + '. oldal'"></span>
        <a class="btn btn-outline-light btn-sm" th:if="${eloadasok.hasNext()}"
           th:href="@{/adatbazis(page=${eloadasok.number + 1})}">Következő »</a>
        <span th:unless="${eloadasok.hasNext()}"></span>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
