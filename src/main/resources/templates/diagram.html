<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Diagram')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>

<main class="container my-4">
    <h1 class="mb-4">Diagramok</h1>

    <h2>Nézők száma városonként (első 10 város)</h2>
    <div class="mb-5" style="position: relative; height: 380px;">
        <canvas id="varosDiagram"></canvas>
    </div>

    <h2>A 10 legnagyobb bevételt hozó film</h2>
    <div class="mb-5" style="position: relative; height: 420px;">
        <canvas id="filmDiagram"></canvas>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const varosCimkek = /*[[${varosCimkek}]]*/ [];
    const varosAdatok = /*[[${varosAdatok}]]*/ [];
    const filmCimkek = /*[[${filmCimkek}]]*/ [];
    const filmAdatok = /*[[${filmAdatok}]]*/ [];

    Chart.defaults.color = '#ffffff';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.15)';

    new Chart(document.getElementById('varosDiagram'), {
        type: 'bar',
        data: {
            labels: varosCimkek,
            datasets: [{
                label: 'Nézők száma (fő)',
                data: varosAdatok,
                backgroundColor: 'rgba(243, 156, 18, 0.8)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } }
        }
    });

    new Chart(document.getElementById('filmDiagram'), {
        type: 'bar',
        data: {
            labels: filmCimkek,
            datasets: [{
                label: 'Bevétel (Ft)',
                data: filmAdatok,
                backgroundColor: 'rgba(52, 152, 219, 0.8)'
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            scales: { x: { beginAtZero: true } }
        }
    });
</script>
</body>
</html>
