<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Belépés</title>
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<hr>
<h1>Belépés</h1>
<div th:if="${param.registered}" style="color: green;">Sikeres regisztráció! Most már beléphet.</div>
<div th:if="${param.error}" style="color: red;">Hibás felhasználónév vagy jelszó!</div>
<form th:action="@{/login}" method="post">
    <label>Felhasználónév:</label> <input type="text" name="username"><br>
    <label>Jelszó:</label> <input type="password" name="password"><br>
    <button type="submit">Belépés</button>
</form>
</body>
</html>
