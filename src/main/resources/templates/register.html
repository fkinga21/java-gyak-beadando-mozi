<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Regisztráció')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>

<main class="container my-5" style="max-width: 480px;">
    <h1 class="mb-4">Regisztráció</h1>
    <div th:if="${error}" th:text="${error}" class="alert alert-danger"></div>
    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Felhasználónév</label>
            <input class="form-control" type="text" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Jelszó</label>
            <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Regisztráció</button>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
